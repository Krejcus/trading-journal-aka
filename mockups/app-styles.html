<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaTrade — Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@500;600;700;800&family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   OVLÁDÁNÍ NÁHLEDU (mimo aplikaci — stejné pro všechny styly)
   ═══════════════════════════════════════════════════════════════════ */
:root { --ui-bg:#e8ebf0; --ui-panel:#ffffff; --ui-ink:#0f172a; --ui-ink2:#475569; --ui-line:#dfe3ea; --ui-acc:#4f46e5; }
:root[data-ui="dark"] { --ui-bg:#05070c; --ui-panel:#0d1119; --ui-ink:#f1f5f9; --ui-ink2:#94a3b8; --ui-line:rgba(255,255,255,.08); --ui-acc:#818cf8; }
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--ui-bg); color:var(--ui-ink); font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; transition:background .4s; }
button { font:inherit; color:inherit; }

.ctl { position:sticky; top:0; z-index:100; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:10px 16px;
  background:color-mix(in srgb, var(--ui-panel) 92%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--ui-line); }
.ctl .brand { font-weight:900; letter-spacing:-.02em; font-size:14px; margin-right:6px; }
.ctl .grp { display:flex; align-items:center; gap:6px; }
.ctl .grp[hidden] { display:none; }
.ctl .grp > b { font-size:9.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--ui-ink2); margin-right:2px; }
.seg { display:inline-flex; padding:2px; border-radius:9px; border:1px solid var(--ui-line); background:var(--ui-bg); }
.seg button { border:0; background:transparent; padding:6px 11px; border-radius:7px; font-size:12px; font-weight:700; color:var(--ui-ink2); cursor:pointer; white-space:nowrap; }
.seg button[aria-pressed="true"] { background:var(--ui-panel); color:var(--ui-ink); box-shadow:0 1px 3px rgba(15,23,42,.15), 0 0 0 1px var(--ui-line); }
.seg.styles button[aria-pressed="true"] { background:var(--ui-acc); color:#fff; box-shadow:none; }
.seg button .k { font-size:10px; opacity:.55; margin-right:4px; font-variant-numeric:tabular-nums; }
.ctl .spacer { flex:1; }
#opRange { width:150px; accent-color:var(--ui-acc); }
.opval { min-width:74px; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ui-ink); }
.opval small { font-weight:600; color:var(--ui-ink2); }
.opreset { border:1px solid var(--ui-line); background:var(--ui-bg); color:var(--ui-ink2); border-radius:8px; padding:5px 9px; font-size:11px; font-weight:700; cursor:pointer; }
.opreset:disabled { opacity:.4; cursor:default; }
.seg.pal button { display:inline-flex; align-items:center; gap:6px; }
.seg.pal button i { display:inline-flex; width:30px; height:14px; border-radius:99px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.08); }
.seg.pal button i b { flex:1; }
.pick { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px 0 4px; border-radius:9px; border:1px solid var(--ui-line); background:var(--ui-bg); font-size:12px; font-weight:700; color:var(--ui-ink2); cursor:pointer; }
.pick input { width:24px; height:24px; padding:0; border:0; border-radius:6px; background:none; cursor:pointer; }
.pick input::-webkit-color-swatch-wrapper { padding:0; } .pick input::-webkit-color-swatch { border:0; border-radius:6px; }
.pick.on { border-color:var(--ui-acc); color:var(--ui-ink); }
.ctl .hint { font-size:11px; color:var(--ui-ink2); }
.ctl kbd { font:600 10px Inter; padding:1px 5px; border-radius:4px; border:1px solid var(--ui-line); background:var(--ui-bg); }

.about { display:none !important; max-width:1480px; margin:18px auto 0; padding:0 16px; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px; }
.about .card-ui { background:var(--ui-panel); border:1px solid var(--ui-line); border-radius:12px; padding:16px 18px; }
.about h2 { margin:0 0 4px; font-size:20px; letter-spacing:-.02em; font-weight:900; display:flex; align-items:baseline; gap:10px; }
.about h2 small { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ui-ink2); }
.about p { margin:6px 0 0; font-size:13px; line-height:1.6; color:var(--ui-ink2); }
.about p b { color:var(--ui-ink); }
.about ul { margin:8px 0 0; padding:0 0 0 18px; font-size:12.5px; line-height:1.6; color:var(--ui-ink2); }
.about ul li b { color:var(--ui-ink); }
.about .cols { display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; }
.about .cols h3 { margin:6px 0 0; font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--ui-ink2); }
.about .sw { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.about .sw span { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ui-ink2); padding:3px 8px 3px 3px; border-radius:99px; border:1px solid var(--ui-line); }
.about .sw i { width:16px; height:16px; border-radius:99px; border:1px solid rgba(0,0,0,.1); }
.about .fonts { margin-top:8px; font-size:12px; color:var(--ui-ink2); }

.stage { max-width:1480px; margin:14px auto 60px; padding:0 16px; }
.stage.phone { display:flex; justify-content:center; gap:28px; flex-wrap:wrap; }
.frame { position:relative; }
.stage.phone .frame { width:402px; height:874px; padding:12px; border-radius:58px; background:#0b0d12; box-shadow:0 40px 80px -30px rgba(0,0,0,.6), inset 0 0 0 2px #2a2e37; }
.stage.phone .frame::before { content:''; position:absolute; z-index:60; top:22px; left:50%; width:118px; height:34px; margin-left:-59px; border-radius:20px; background:#000; }
.stage.phone .frame > .app { height:100%; border-radius:46px; }
.stage.all .frame + .frame { margin-top:26px; }
.frame-cap { display:none; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ui-ink2); margin:0 0 8px 4px; }
.stage.all .frame-cap { display:block; }
.stage.phone .frame-cap { display:none; }
.stage.cmp .frame-cap { display:block; text-align:left; }
.stage.cmp:not(.phone) .frame + .frame { margin-top:26px; }
.stage.phone.cmp .frame-cap { position:absolute; top:-26px; left:8px; }
.stage.phone.cmp { padding-top:30px; row-gap:56px; }

/* ═══════════════════════════════════════════════════════════════════
   APLIKACE — rozložení. Barvy, písma, rohy a stíny jdou jen přes
   proměnné; jednotlivé styly je níž přepisují. Markup je pro všech
   pět stylů stejný.
   ═══════════════════════════════════════════════════════════════════ */
.app {
  /* barvy (Klasika světlá jako výchozí; přepisuje se níž) */
  --page:#f8fafc; --surface:#ffffff; --surface2:#f8fafc; --sunken:#f1f5f9; --line:#e2e8f0; --line2:#eef2f6;
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:rgba(79,70,229,.1);
  --win:#059669; --loss:#e11d48; --warn:#d97706; --info:#2563eb; --neutral:#94a3b8;
  --armed:#059669; --armed-soft:rgba(5,150,105,.12); --lock:#d97706;
  --chart-bg:#ffffff; --grid:#f0f3fa; --axis:#131722; --bull:#e5e7eb; --bull-line:#62646e; --bear:#1f5bc4;
  --cal-win:#5fae7c; --cal-loss:#e48f9a; --cal-empty:var(--sunken);
  --heat-ok:#66b37f; --heat-part:#e3a52c; --heat-bad:#e9a5ae; --heat-none:#e2e6ee;
  /* tvar a typografie */
  --font-ui:Inter, system-ui, sans-serif; --font-num:Inter, system-ui, sans-serif; --font-display:Inter, system-ui, sans-serif; --font-mono:'JetBrains Mono', ui-monospace, monospace;
  --num-feat:'tnum' 1; --display-weight:900; --display-ls:-.02em; --display-case:uppercase;
  --hero-weight:300; --hero-ls:-.04em; --kpi-weight:800;
  --label-size:9.5px; --label-weight:900; --label-ls:.12em; --label-case:uppercase; --label-font:var(--font-ui);
  --r:10px; --r2:8px; --r3:6px; --pill:6px; --bw:1px;
  --card-bg:var(--surface); --card-border:var(--line); --card-shadow:0 4px 20px -5px rgba(15,23,42,.06), 0 10px 10px -5px rgba(15,23,42,.02);
  --pad:18px; --gap:16px; --row-h:42px;
  --float-bg:color-mix(in srgb, var(--surface) 92%, transparent); --float-blur:12px; --float-border:var(--line); --float-shadow:0 20px 40px -18px rgba(15,23,42,.3);
  --rail-bg:var(--surface); --top-bg:var(--surface);
  --modal-bg:var(--surface); --modal-shadow:0 40px 80px -40px rgba(15,23,42,.55); --scrim:color-mix(in srgb, var(--page) 88%, transparent); --scrim-blur:14px;
  position:relative; overflow:hidden; border-radius:16px; background:var(--page); color:var(--ink); font-family:var(--font-ui);
  font-feature-settings:'cv11' 1; container-type:inline-size; container-name:app;
  height:900px; display:grid; grid-template-columns:76px 1fr; grid-template-rows:auto 1fr;
  transition:background .45s ease, color .45s ease;
  box-shadow:0 30px 60px -30px rgba(15,23,42,.35), 0 0 0 1px rgba(15,23,42,.06);
}
.app *, .app *::before, .app *::after { transition:background-color .45s ease, border-color .45s ease, color .45s ease, box-shadow .45s ease, border-radius .45s ease; }
.app .num { font-family:var(--font-num); font-feature-settings:var(--num-feat); font-variant-numeric:tabular-nums; }
.app .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.app .win { color:var(--win); } .app .loss { color:var(--loss); } .app .muted { color:var(--ink3); } .app .dim { color:var(--ink2); }
.app svg { display:block; }
.app span > svg, .app b > svg, .app td > svg, .app .chip > svg { display:inline-block; vertical-align:-2px; flex:none; }
.tbl tr.subh th { background:transparent; border-top:0; padding-top:7px; padding-bottom:5px; font-size:calc(var(--label-size) - .5px); opacity:.85; }
.tbl tr.subh th:first-child { padding-left:34px; }
.ambient { position:absolute; inset:0; pointer-events:none; opacity:0; z-index:0; }

/* ── navigační lišta vlevo ── */
.rail { grid-row:1 / span 2; position:relative; z-index:5; display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 0;
  margin:14px 0 14px 14px; border-radius:var(--r); background:var(--rail-bg); border:var(--bw) solid var(--card-border); box-shadow:var(--card-shadow); }
.rail .logo { width:38px; height:38px; display:grid; place-items:center; font-weight:900; font-size:13px; letter-spacing:-.04em; color:var(--ink); margin-bottom:6px; font-family:var(--font-display); }
.rail .it { position:relative; width:40px; height:40px; display:grid; place-items:center; border-radius:var(--r2); color:var(--ink3); cursor:pointer; border:0; background:transparent; }
.rail .it:hover { color:var(--ink); background:var(--sunken); }
.rail .it.on { color:var(--ink); background:var(--sunken); box-shadow:inset 0 0 0 1px var(--line); }
.rail .it .badge { position:absolute; top:3px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--win); color:#fff; font-size:9px; font-weight:800; display:grid; place-items:center; }
.rail .sep { width:24px; height:1px; background:var(--line); margin:6px 0; }
.rail .live-btn { color:var(--win); background:var(--armed-soft); }
.rail .grow { flex:1; }
.rail .avatar { width:34px; height:34px; border-radius:99px; background:linear-gradient(135deg,#334155,#0f172a); box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--line); }

/* ── horní lišta ── */
.topbar { position:relative; z-index:4; display:flex; align-items:center; gap:12px; height:58px; margin:14px 14px 0 16px; padding:0 14px 0 18px;
  border-radius:var(--r); background:var(--top-bg); border:var(--bw) solid var(--card-border); box-shadow:var(--card-shadow); }
.topbar h1 { margin:0; font-family:var(--font-display); font-size:17px; font-weight:var(--display-weight); letter-spacing:var(--display-ls); text-transform:var(--display-case); }
.topbar .crumb { font-size:12px; color:var(--ink3); }
.topbar .grow { flex:1; }
.pill { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:var(--pill); border:var(--bw) solid var(--line);
  font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); background:var(--surface); white-space:nowrap; }
.pill i { width:6px; height:6px; border-radius:99px; background:var(--win); }
.ibtn { position:relative; width:34px; height:34px; display:grid; place-items:center; border-radius:var(--r2); border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink2); cursor:pointer; }
.ibtn:hover { color:var(--ink); }
.ibtn .badge { position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:99px; background:var(--accent); color:var(--accent-ink); font-size:9.5px; font-weight:800; display:grid; place-items:center; }

/* ── obsah stránek ── */
.screens { position:relative; z-index:2; min-height:0; overflow:hidden; }
.screen { position:absolute; inset:0; overflow:auto; padding:18px 14px 28px 16px; opacity:0; pointer-events:none; transform:translateY(6px); transition:opacity .3s ease, transform .35s cubic-bezier(.22,.61,.36,1); scrollbar-width:thin; }
.screen.on { opacity:1; pointer-events:auto; transform:none; }
.stage.all:not(.phone) .screen { position:relative; inset:auto; opacity:1; pointer-events:auto; transform:none; overflow:visible; }
.stage.all:not(.phone) .app { height:auto; }

.lbl { font-family:var(--label-font); font-size:var(--label-size); font-weight:var(--label-weight); letter-spacing:var(--label-ls); text-transform:var(--label-case); color:var(--ink3); }
.card { position:relative; background:var(--card-bg); border:var(--bw) solid var(--card-border); border-radius:var(--r); box-shadow:var(--card-shadow); padding:var(--pad); min-width:0; }
.card-h { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.card-h h3 { margin:0; font-family:var(--label-font); font-size:var(--label-size); font-weight:var(--label-weight); letter-spacing:var(--label-ls); text-transform:var(--label-case); color:var(--ink); }
.card-h .ic { color:var(--ink3); }
.card-h .grow { flex:1; }
.card-h .meta { font-size:11px; color:var(--ink3); font-weight:600; }
.chip { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:var(--pill); border:var(--bw) solid var(--line); font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); background:var(--surface); white-space:nowrap; }
.chip.long { color:var(--win); border-color:color-mix(in srgb, var(--win) 28%, transparent); background:color-mix(in srgb, var(--win) 8%, transparent); }
.chip.short { color:var(--loss); border-color:color-mix(in srgb, var(--loss) 28%, transparent); background:color-mix(in srgb, var(--loss) 8%, transparent); }
.chip.acc { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 28%, transparent); background:var(--accent-soft); }
.chip.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 30%, transparent); background:color-mix(in srgb, var(--warn) 9%, transparent); }
.chip.plain { text-transform:none; letter-spacing:0; font-size:11px; font-weight:600; }
.chip.mono { font-family:var(--font-mono); text-transform:none; letter-spacing:0; font-size:10.5px; font-weight:500; }
.btn { display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 13px; border-radius:var(--r2); border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink2); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
.btn:hover { color:var(--ink); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.sm { height:28px; padding:0 10px; font-size:11px; }
.btn.danger { color:var(--loss); border-color:color-mix(in srgb, var(--loss) 35%, transparent); background:color-mix(in srgb, var(--loss) 6%, transparent); }

/* ── DASHBOARD ── */
.dash { display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:var(--gap); }
.kpi { grid-column:span 3; display:flex; flex-direction:column; gap:8px; min-height:148px; }
.kpi .big { font-size:30px; font-weight:var(--kpi-weight); letter-spacing:-.03em; line-height:1; }
.kpi .sub { font-size:11.5px; color:var(--ink2); line-height:1.45; }
.kpi .row { display:flex; align-items:center; gap:12px; }
.kpi .wl { display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--sunken); margin-top:auto; }
.kpi .wl i { display:block; height:100%; }
.kpi .wlk { display:flex; justify-content:space-between; font-size:11px; font-weight:700; }
.rituals { grid-column:span 12; }
.rit-grid { display:grid; grid-template-columns:130px 1fr 290px; gap:20px; align-items:start; }
.score { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.score .ring { width:86px; height:86px; }
.heat { display:grid; grid-template-columns:repeat(15, 1fr); gap:5px; }
.heat i { height:26px; border-radius:var(--r3); background:var(--heat-none); position:relative; }
.heat i[data-s="ok"] { background:var(--heat-ok); } .heat i[data-s="part"] { background:var(--heat-part); } .heat i[data-s="bad"] { background:var(--heat-bad); }
.heat i.today { box-shadow:0 0 0 2px var(--ink); }
.heat-key { display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--ink2); }
.heat-key span { display:inline-flex; align-items:center; gap:6px; } .heat-key i { width:10px; height:10px; border-radius:3px; display:inline-block; }
.rules { display:flex; flex-direction:column; gap:7px; }
.rule { display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--ink2); }
.rule b { min-width:22px; height:22px; border-radius:var(--r3); display:grid; place-items:center; font-size:11px; background:var(--sunken); color:var(--ink); }
.rule .bar { flex:1; height:4px; border-radius:99px; background:var(--sunken); overflow:hidden; } .rule .bar i { display:block; height:100%; background:var(--win); border-radius:99px; }
.equity { grid-column:span 7; }
.calendar { grid-column:span 5; grid-row:span 2; }
.mc { grid-column:span 7; }
.chart-box { position:relative; height:240px; }
.chart-box svg { width:100%; height:100%; }
.cal-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.cal-head .m { font-family:var(--font-display); font-size:20px; font-weight:800; letter-spacing:-.02em; }
.cal-head .grow { flex:1; }
.cal-month { text-align:right; } .cal-month .num { font-size:20px; font-weight:800; }
.cal-grid { display:grid; grid-template-columns:repeat(5, 1fr) 1.05fr; gap:6px; }
.cal-grid .dh { text-align:center; font-size:10px; font-weight:800; letter-spacing:.08em; color:var(--ink3); padding:6px 0; border-radius:var(--r3); background:var(--sunken); }
.cal-grid .d { position:relative; aspect-ratio:1.05; border-radius:var(--r3); background:var(--cal-empty); padding:6px 7px; display:flex; flex-direction:column; justify-content:space-between; font-size:10px; color:var(--ink3); border:var(--bw) solid transparent; }
.cal-grid .d .n { font-weight:700; text-align:right; }
.cal-grid .d .v { font-size:12px; font-weight:800; text-align:center; }
.cal-grid .d .t { font-size:9.5px; text-align:center; opacity:.8; }
.cal-grid .d.w { background:var(--cal-win); color:#fff; } .cal-grid .d.l { background:var(--cal-loss); color:#fff; }
.cal-grid .d.out { opacity:.4; }
.cal-grid .wk { border-radius:var(--r3); border:var(--bw) solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; color:var(--ink3); font-weight:700; }
.cal-grid .wk .num { font-size:12.5px; font-weight:800; }
.mc-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 16px; margin-top:12px; padding-top:12px; border-top:var(--bw) solid var(--line2); }
.mc-stats .num { font-size:16px; font-weight:800; display:block; margin-top:3px; }
.mc-stats small { font-size:10.5px; color:var(--ink3); }

/* ── LIVE ── */
.subtabs { display:flex; gap:2px; margin:0 0 16px; border-bottom:var(--bw) solid var(--line); overflow-x:auto; scrollbar-width:none; }
.subtabs button { border:0; background:transparent; display:inline-flex; align-items:center; gap:7px; padding:10px 12px; font-size:12px; font-weight:700; color:var(--ink3); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }

/* ════════════════════════════════════════════════════════════════
   SKLO — společný základ pro varianty 1–4. Každá varianta jen nastaví
   pozadí (barevné skvrny), průsvitnost, rozmazání, hrany a barvy.
   ════════════════════════════════════════════════════════════════ */
.ambient { transition:opacity .6s ease; overflow:hidden; }
.ambient i { position:absolute; border-radius:50%; filter:blur(var(--bb, 80px)); opacity:var(--bo, .6); transition:background 1.2s ease, opacity .8s ease; }
.ambient i:nth-child(1) { width:52%; height:58%; left:-12%; top:-14%; background:var(--b1); }
.ambient i:nth-child(2) { width:44%; height:52%; right:-10%; top:14%; background:var(--b2); }
.ambient i:nth-child(3) { width:54%; height:46%; left:22%; bottom:-20%; background:var(--b3); }
.ambient i:nth-child(4) { width:26%; height:32%; left:52%; top:34%; background:var(--b4); opacity:calc(var(--bo, .6) * .8); }
.ambient i:nth-child(5) { width:24%; height:30%; left:6%; top:52%; background:var(--b5); opacity:calc(var(--bo, .6) * .8); }
@keyframes drift { 0%, 100% { transform:translate(0, 0) scale(1); } 50% { transform:translate(3%, 4%) scale(1.06); } }
.app.glassy .ambient i { animation:drift 26s ease-in-out infinite; }

// ════════════════════════════════════════════════════════════════════
// Grafy — barvy přes CSS proměnné (style="…var(--x)"), takže změna
// stylu nepotřebuje překreslení; překresluje se jen při změně rozměrů.
// ════════════════════════════════════════════════════════════════════
const sz = el => { const r = el.getBoundingClientRect(); return { W: Math.max(60, Math.round(r.width)), H: Math.max(30, Math.round(r.height)) }; };
function drawSpark(svg) {
  const pts = EQUITY.filter((_, i) => i % 4 === 0), mn = Math.min(...pts), mx = Math.max(...pts);
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 200).toFixed(1)},${(32 - (v - mn) / (mx - mn) * 28).toFixed(1)}`).join('');
  svg.innerHTML = `<path d="${d} L200,36 L0,36Z" style="fill:var(--win);opacity:.12"/><path d="${d}" style="fill:none;stroke:var(--win);stroke-width:1.6" vector-effect="non-scaling-stroke"/>`;
}
function ring(svg, frac, color, label, sub) {
  const s = svg.viewBox.baseVal.width, r = s / 2 - 7, c = 2 * Math.PI * r;
  svg.innerHTML = `<circle cx="${s / 2}" cy="${s / 2}" r="${r}" style="fill:none;stroke:var(--sunken);stroke-width:8"/>
    <circle cx="${s / 2}" cy="${s / 2}" r="${r}" style="fill:none;stroke:${color};stroke-width:8;stroke-linecap:round" stroke-dasharray="${c * frac} ${c}" transform="rotate(-90 ${s / 2} ${s / 2})"/>
    ${label ? `<text x="50%" y="${sub ? '47%' : '54%'}" text-anchor="middle" style="fill:var(--ink);font:800 ${s * .24}px var(--font-num)">${label}</text>` : ''}
    ${sub ? `<text x="50%" y="66%" text-anchor="middle" style="fill:var(--ink3);font:700 ${s * .1}px var(--font-ui);letter-spacing:.08em">${sub}</text>` : ''}`;
}
function drawEquity(svg) {
  const { W, H } = sz(svg); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const padL = 46, padR = 8, padT = 8, uw = 34, padB = 22 + uw;
  const mn = Math.min(...EQUITY), mx = Math.max(...EQUITY);
  const x = i => padL + i / (EQUITY.length - 1) * (W - padL - padR), y = v => padT + (mx - v) / (mx - mn) * (H - padT - padB);
  let o = '';
  for (let k = 0; k <= 4; k++) { const v = mn + (mx - mn) * k / 4; o += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line2)"/><text x="${padL - 6}" y="${y(v) + 3.5}" text-anchor="end" style="fill:var(--ink3);font:500 10px var(--font-num)">$${Math.round(v / 1000)}k</text>`; }
  const d = EQUITY.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  o += `<defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--win);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--win);stop-opacity:0"/></linearGradient></defs>`;
  o += `<path d="${d} L${x(EQUITY.length - 1)},${H - padB} L${padL},${H - padB}Z" fill="url(#eqg)"/><path d="${d}" style="fill:none;stroke:var(--win);stroke-width:2;stroke-linejoin:round"/>`;
  // drawdown pod čarou (underwater)
  let peak = -Infinity; const dd = EQUITY.map(v => (peak = Math.max(peak, v), v - peak)); const mdd = Math.min(...dd) || -1;
  const base = H - uw + 2, yd = v => base + (v / mdd) * (uw - 10);
  o += `<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}" style="stroke:var(--line)"/><text x="${padL - 6}" y="${base + 12}" text-anchor="end" style="fill:var(--ink3);font:500 9.5px var(--font-ui)">DD</text>`;
  o += `<path d="M${padL},${base} ${dd.map((v, i) => `L${x(i).toFixed(1)},${yd(v).toFixed(1)}`).join(' ')} L${W - padR},${base}Z" style="fill:var(--loss);opacity:.28"/>`;
  svg.innerHTML = o;
}
function drawMC(svg) {
  const { W, H } = sz(svg); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const n = 60, all = MC.flat(), mn = Math.min(...all, -2500), mx = Math.max(...all);
  const x = i => 6 + i / n * (W - 12), y = v => 6 + (mx - v) / (mx - mn) * (H - 12);
  const q = (i, p) => { const s = MC.map(pp => pp[i]).sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
  const band = (a, b) => { let d = ''; for (let i = 0; i <= n; i++) d += `${i ? 'L' : 'M'}${x(i)},${y(q(i, b))}`; for (let i = n; i >= 0; i--) d += `L${x(i)},${y(q(i, a))}`; return d + 'Z'; };
  let o = `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line);stroke-dasharray:3 4"/>`;
  o += `<path d="${band(.05, .95)}" style="fill:var(--accent);opacity:.12"/><path d="${band(.25, .75)}" style="fill:var(--accent);opacity:.18"/>`;
  MC.slice(0, 8).forEach(p => { o += `<path d="${p.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join('')}" style="fill:none;stroke:var(--accent);stroke-width:.8;opacity:.25"/>`; });
  let med = ''; for (let i = 0; i <= n; i++) med += `${i ? 'L' : 'M'}${x(i)},${y(q(i, .5))}`; o += `<path d="${med}" style="fill:none;stroke:var(--accent);stroke-width:2.2"/>`;
  svg.innerHTML = o;
}
function drawThumb(svg) {
  const { W, H } = sz(svg); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  seed = Number(svg.dataset.seed) * 97; const short = svg.dataset.dir === 'Short', win = svg.dataset.win === '1';
  const n = 34, bw = W / n * .6; let p = 50; const cs = [];
  for (let i = 0; i < n; i++) { const drift = i > 14 && i < 26 ? ((short ? -1 : 1) * (win ? 1 : -1)) * 1.6 : 0; const o = p; p += (rnd() - .5) * 4 + drift; cs.push({ o, c: p, hi: Math.max(o, p) + rnd() * 2.5, lo: Math.min(o, p) - rnd() * 2.5 }); }
  const all = cs.flatMap(c => [c.hi, c.lo]), mn = Math.min(...all) - 2, mx = Math.max(...all) + 2, y = v => 4 + (mx - v) / (mx - mn) * (H - 8);
  const ei = 14, xi = 26, ep = cs[ei].c, xp = cs[xi].c;
  let o = `<rect x="${ei / n * W}" y="${Math.min(y(ep), y(xp))}" width="${(xi - ei) / n * W}" height="${Math.abs(y(xp) - y(ep))}" style="fill:${win ? 'var(--win)' : 'var(--loss)'};opacity:.14"/>`;
  cs.forEach((c, i) => { const cx = (i + .5) / n * W, up = c.c >= c.o; o += `<line x1="${cx}" x2="${cx}" y1="${y(c.hi)}" y2="${y(c.lo)}" style="stroke:${up ? 'var(--bull-line)' : 'var(--bear)'}"/><rect x="${cx - bw / 2}" y="${y(Math.max(c.o, c.c))}" width="${bw}" height="${Math.max(1, Math.abs(y(c.o) - y(c.c)))}" style="fill:${up ? 'var(--bull)' : 'var(--bear)'};stroke:${up ? 'var(--bull-line)' : 'none'};stroke-width:.6"/>`; });
  o += `<line x1="${ei / n * W}" x2="${W}" y1="${y(ep)}" y2="${y(ep)}" style="stroke:var(--info);stroke-dasharray:2 2;stroke-width:.8"/>`;
  svg.innerHTML = o;
}

// ════════════════════════════════════════════════════════════════════
// Nastavení → Vzhled (stránka v aplikaci; změny se hned projeví všude)
// ════════════════════════════════════════════════════════════════════
const DEPTHS_DEF = { light:['#a5b4fc','#7dd3fc','#f0abfc','#c7d2fe','#bae6fd'], dark:['#6366f1','#0ea5e9','#d946ef','#4338ca','#0369a1'] };
const AURORA_DEF = { light:['#8d9bff','#6fe3d4','#ffb7d5','#c7b6ff','#9fd4ff'], dark:['#4f46e5','#0e7490','#be185d','#6d28d9','#0369a1'] };
const isDarkMode = () => S.mode === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : S.mode === 'dark';
function swatchColors(k) {
  const dark = isDarkMode();
  if (k === 'vlastni') return customPalette(S.palHex, dark);
  if (k === 'vychozi') return (S.scene === 'depths' ? DEPTHS_DEF : AURORA_DEF)[dark ? 'dark' : 'light'];
  return PALETTES[k][dark ? 'dark' : 'light'];
}
// zmenšená equity křivka pro náhled v Nastavení
const miniPath = h => { const pts = EQUITY.filter((_, i) => i % 4 === 0), mn = Math.min(...pts), mx = Math.max(...pts);
  return pts.map((v, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 100).toFixed(1)},${(h - 2 - (v - mn) / (mx - mn) * (h - 6)).toFixed(1)}`).join(''); };
function settingsHTML() {
  const tabs = ['Psychologie', 'Strategie', 'Trh', 'Notifikace', 'Systém', 'Vzhled'];
  const pals = Object.entries(PALETTES).map(([k, p]) => `<button class="pal-dot" data-set="pal" data-v="${k}" title="${p.name}"><span class="pal-sw" data-sw="${k}"></span></button>`).join('');
  return `${cap('Nastavení · Vzhled')}<div class="subtabs set-tabs">${tabs.map(t => `<button class="${t === 'Vzhled' ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="set-grid">
    <div class="card set-card">
      <div class="set-row"><b class="set-l">Režim</b>
        <div class="seg-in set-seg"><button data-set="mode" data-v="light">Světlý</button><button data-set="mode" data-v="dark">Tmavý</button><button data-set="mode" data-v="auto">Podle systému</button></div></div>
      <div class="set-row"><b class="set-l">Pozadí</b>
        <div class="bg-opts">
          <button class="bg-opt" data-set="scene" data-v="depths"><span class="bgprev depths"><i></i><i></i><i></i></span>Hlubiny</button>
          <button class="bg-opt" data-set="scene" data-v="field"><span class="bgprev field"><i></i><i></i><i></i></span>Barevné pole</button>
        </div></div>
      <div class="set-row"><b class="set-l">Barvy <small class="pal-name"></small></b>
        <div class="pal-row">${pals}<label class="pal-dot custom" data-set="pal" data-v="vlastni" title="Vlastní barva"><span class="pal-sw" data-sw="vlastni"></span><input type="color" data-set="palhex" aria-label="Vlastní barva"></label></div></div>
      <div class="set-row"><b class="set-l">Síla pozadí</b>
        <div class="slider"><span>Jemné</span><input type="range" min="0" max="100" step="1" data-set="strength" aria-label="Síla pozadí"><span>Výrazné</span></div></div>
      <div class="set-row"><b class="set-l">Průhlednost karet</b>
        <div class="slider"><span>Neprůhledné</span><input type="range" min="10" max="90" step="1" data-set="op" aria-label="Průhlednost karet"><span>Průhledné</span></div></div>
      <div class="set-foot"><span class="dim">Uloženo k účtu · platí na všech zařízeních</span><button class="btn sm" data-reset>Obnovit výchozí</button></div>
    </div>
    <div class="card set-prev">
      <div class="mini">
        <div class="mini-bg"><i></i><i></i><i></i></div>
        <div class="mini-rail">${'<i></i>'.repeat(6)}</div>
        <div class="mini-top"><b>Dashboard</b><span></span></div>
        <div class="mini-grid">
          <div class="mini-card"><span>Net P&amp;L</span><b class="num win">+$17 719</b><svg viewBox="0 0 100 24" preserveAspectRatio="none"><path d="${miniPath(24)}" style="fill:none;stroke:var(--win);stroke-width:1.4" vector-effect="non-scaling-stroke"/></svg></div>
          <div class="mini-card"><span>Win rate</span><b class="num">45,6 %</b><i class="mini-bar"><i style="width:46%;background:var(--win)"></i><i style="width:54%;background:var(--loss)"></i></i></div>
          <div class="mini-card wide"><span>Equity křivka</span><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="${miniPath(40)} L100,40 L0,40Z" style="fill:var(--win);opacity:.14"/><path d="${miniPath(40)}" style="fill:none;stroke:var(--win);stroke-width:1.6" vector-effect="non-scaling-stroke"/></svg></div>
          <div class="mini-card"><span>Září</span><div class="mini-cal">${[412, -215, 890, -1430, 260, 1210, -95, 2840, -610, 455].map(v => `<i class="${v > 0 ? 'w' : 'l'}" style="--k:${Math.round(30 + Math.min(1, Math.abs(v) / 2000) * 60)}%"></i>`).join('')}</div></div>
        </div>
      </div>
      <div class="mini-cap"><span class="lbl">Náhled</span><span class="dim">takhle bude vypadat dashboard</span></div>
    </div>
  </div>`;
}
function renderSettings(app) {
  app.querySelectorAll('[data-set="mode"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.mode));
  app.querySelectorAll('[data-set="scene"]').forEach(b => b.classList.toggle('on', b.dataset.v === S.scene));
  app.querySelectorAll('.pal-dot').forEach(b => b.classList.toggle('on', b.dataset.v === S.pal));
  app.querySelectorAll('.pal-name').forEach(el => { el.textContent = S.pal === 'vlastni' ? 'Vlastní' : PALETTES[S.pal]?.name ?? ''; });
  app.querySelectorAll('.pal-sw[data-sw]').forEach(el => { el.innerHTML = swatchColors(el.dataset.sw).map(c => `<i style="background:${c}"></i>`).join(''); });
  const st = app.querySelector('[data-set="strength"]'); if (st) st.value = S.strength;
  const op = app.querySelector('[data-set="op"]'); if (op) op.value = S.op;
  const ph = app.querySelector('[data-set="palhex"]'); if (ph) ph.value = S.palHex;
}
const DEFAULTS = { mode:'dark', scene:'depths', pal:'vychozi', palHex:'#6366f1', strength:80, op:54 };
function wireSettings(app) {
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-set]');
    if (b && b.tagName !== 'INPUT' && b.dataset.v) {
      const key = b.dataset.set === 'scene' ? 'scene' : b.dataset.set === 'pal' ? 'pal' : b.dataset.set === 'mode' ? 'mode' : null;
      if (key) { S[key] = b.dataset.v; applyLook(); requestAnimationFrame(drawAll); }
    }
    if (e.target.closest('[data-reset]')) { Object.assign(S, DEFAULTS); applyLook(); requestAnimationFrame(drawAll); }
  });
  app.addEventListener('input', e => {
    const k = e.target.dataset?.set;
    if (k === 'strength') { S.strength = Number(e.target.value); applyStrength(); saveS(); }
    if (k === 'op') { S.op = Number(e.target.value); applyOpacity(); saveS(); }
    if (k === 'palhex') { S.palHex = e.target.value; S.pal = 'vlastni'; applyLook(); }
  });
}
const saveS = () => { try { localStorage.setItem('mock:app-styles-g', JSON.stringify(S)); } catch {} };
// Síla: jedna hodnota 0–100 → průhlednost a sytost barevné vrstvy
function applyStrength() {
  const t = S.strength / 100;
  apps.forEach(app => { app.querySelectorAll('.ambient, .mini-bg').forEach(a => { a.style.opacity = (0.3 + 0.7 * t).toFixed(2); a.style.filter = `saturate(${(0.12 + 0.88 * t).toFixed(2)})`; }); });
}

// ── ovládání náhledu ──
document.getElementById('segStyle').innerHTML = STYLES.map((s, i) => `<button data-v="${s.id}"><span class="k">${i + 1}</span>${s.name}</button>`).join('');
const bindSeg = (id, key, rebuild) => document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener('click', () => { S[key] = b.dataset.v; rebuild ? build() : (applyLook(), requestAnimationFrame(drawAll)); }));
bindSeg('segStyle', 'style'); bindSeg('segMode', 'mode'); bindSeg('segBg', 'bg'); bindSeg('segCase', 'hcase'); bindSeg('segCmp', 'compare', true); bindSeg('segView', 'view', true); bindSeg('segScreen', 'screen', true);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'd' || e.key === 'D') { S.mode = isDarkMode() ? 'light' : 'dark'; applyLook(); }
  if (e.key === 't' || e.key === 'T') { S.view = S.view === 'phone' ? 'desktop' : 'phone'; build(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawAll, 120); });
build();

</script>
</body>
</html>
