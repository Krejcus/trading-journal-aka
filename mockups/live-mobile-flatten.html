<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE na telefonu — kam s Flatten All</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page:#f1f5f9; --bg-card:#ffffff; --text-primary:#0f172a; --text-secondary:#475569;
  --text-muted:#94a3b8; --border-subtle:#e2e8f0; --accent:#4f46e5; --win:#059669; --loss:#e11d48;
}
.dark {
  --bg-page:#020617; --bg-card:#0a0f1d; --text-primary:#f8fafc; --text-secondary:#94a3b8;
  --text-muted:#475569; --border-subtle:rgba(255,255,255,.08); --accent:#6366f1;
  --win:#10b981; --loss:#f43f5e;
}
* { box-sizing:border-box; }
body { margin:0; padding:24px 16px 80px; font-family:Inter,-apple-system,system-ui,sans-serif;
  background:var(--bg-page); color:var(--text-primary); }
h1 { font-size:21px; font-weight:900; letter-spacing:-.02em; margin:0 0 6px; }
.lede { font-size:13px; line-height:1.65; color:var(--text-secondary); max-width:92ch; margin:0 0 16px; }
.lede b { color:var(--text-primary); }
.bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:9px 12px; margin-bottom:22px;
  border:1px solid var(--border-subtle); border-radius:12px; background:var(--bg-card); }
.bar b { font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
.bar button { font:inherit; font-size:11px; font-weight:800; padding:6px 12px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border-subtle); background:transparent; color:var(--text-secondary); }
.bar button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }

.decks { display:flex; gap:18px; align-items:flex-start; overflow-x:auto; padding-bottom:16px; }
.deck { flex:none; width:375px; }
.deck > h2 { font-size:13px; font-weight:900; margin:0 0 2px; }
.deck > h2 em { font-style:normal; color:var(--text-muted); font-weight:800; font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; margin-right:7px; }
.deck > p { font-size:11.5px; line-height:1.5; color:var(--text-secondary); margin:0 0 9px; min-height:68px; }
.deck > p b { color:var(--text-primary); }

.phone { width:375px; height:620px; overflow-y:auto; border-radius:26px; padding:12px;
  border:1px solid var(--border-subtle); background:var(--bg-page);
  box-shadow:0 18px 40px -26px rgba(15,23,42,.5); position:relative; }
.phone::-webkit-scrollbar { width:6px; }
.phone::-webkit-scrollbar-thumb { background:rgba(100,116,139,.35); border-radius:999px; }

.sect { border:1px solid var(--border-subtle); border-radius:14px; background:var(--bg-card); overflow:hidden; }
.shead { display:flex; align-items:center; gap:10px; padding:12px 14px; flex-wrap:wrap; }
.stitle { font-size:16px; font-weight:900; }
.daybtn { display:inline-flex; align-items:center; gap:8px; padding:5px 9px 5px 11px; border-radius:9px;
  border:1px solid var(--border-subtle); background:transparent; color:var(--text-primary); font:inherit; }
.daybtn .k { font-size:8.5px; font-weight:900; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-secondary); white-space:nowrap; }
.daybtn .v { font-size:13px; font-weight:800; color:var(--win); font-variant-numeric:tabular-nums; }
.daybtn .go { color:var(--text-muted); font-size:12px; }
.iconbtn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
  border-radius:8px; border:1px solid var(--border-subtle); color:var(--text-secondary); font-size:14px; }
.addbtn { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:8px;
  border:1px solid var(--border-subtle); font-size:11.5px; font-weight:700; color:var(--text-secondary); }

.gcard { margin:0 10px 10px; border:1px solid var(--border-subtle); border-radius:12px; overflow:hidden; }
.ghead { display:flex; align-items:center; gap:8px; padding:10px 12px; }
.gname { font-size:14px; font-weight:900; color:#65a30d; }
.gdot { width:7px; height:7px; border-radius:999px; background:#84cc16; flex:none; }
.firms { display:flex; margin-left:2px; }
.firms span { width:20px; height:20px; border-radius:999px; border:1.5px solid var(--bg-card);
  margin-left:-6px; display:flex; align-items:center; justify-content:center; font-size:7px;
  font-weight:900; color:#fff; }
.firms span:first-child { margin-left:0; }
.sw { display:inline-flex; align-items:center; gap:6px; }
.sw.push { margin-left:auto; }
.sw b { font-size:9px; font-weight:900; letter-spacing:.1em; color:var(--text-muted); }
.sw i { width:36px; height:20px; border-radius:999px; background:var(--border-subtle); position:relative; }
.sw i::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:999px;
  background:var(--bg-card); box-shadow:0 1px 3px rgba(0,0,0,.25); }

.gsum { display:grid; border-top:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle);
  background:color-mix(in srgb, var(--bg-page) 55%, transparent); }
.gsum.three { grid-template-columns:repeat(3,1fr); }
.gsum.four { grid-template-columns:1fr 1fr 1fr 84px; }
.gsum > div { padding:8px 12px; border-right:1px solid var(--border-subtle); }
.gsum > div:last-child { border-right:0; }
.gsum .k { font-size:8.5px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--text-secondary); }
.gsum .v { margin-top:1px; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }

/* ── Flatten v jeho různých podobách ─────────────────────────────────── */
.flat-icon { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
  flex:none; border-radius:9px; border:1px solid rgba(225,29,72,.35); background:rgba(225,29,72,.07);
  color:var(--loss); font-size:13px; font-weight:900; }
.flat-cell { display:flex; align-items:center; justify-content:center; padding:0 !important;
  background:rgba(225,29,72,.07); border-left:1px solid rgba(225,29,72,.25) !important;
  color:var(--loss); font-size:11px; font-weight:800; text-align:center; line-height:1.2; }
.toolbar { display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-bottom:1px solid var(--border-subtle); }
.toolbar .danger { height:32px; padding:0 14px; display:inline-flex; align-items:center; border-radius:8px;
  border:1px solid rgba(225,29,72,.35); background:rgba(225,29,72,.07); color:var(--loss);
  font-size:11.5px; font-weight:800; }
.toolbar .plain { height:32px; padding:0 12px; display:inline-flex; align-items:center; border-radius:8px;
  border:1px solid var(--border-subtle); font-size:11.5px; font-weight:700; color:var(--text-secondary); }
.toolbar .plain.icon { width:32px; padding:0; justify-content:center; }
.toolbar .spacer { margin-left:auto; }
.acts { display:flex; gap:8px; padding:10px 12px; }
.acts .plain { height:36px; padding:0 14px; display:flex; align-items:center; border-radius:9px;
  border:1px solid var(--border-subtle); font-size:12px; font-weight:700; color:var(--text-secondary); }
.acts .plain.icon { width:36px; padding:0; justify-content:center; }
.acts .grow { flex:1; justify-content:center; }
.quiet { padding:9px 12px; font-size:10.5px; color:var(--text-muted); border-top:1px solid var(--border-subtle); }

.win { color:var(--win); } .loss { color:var(--loss); } .flat { color:var(--text-secondary); }
.num { font-variant-numeric:tabular-nums; }
.dot { width:7px; height:7px; border-radius:999px; flex:none; background:#10b981; }
.crown { color:#f59e0b; font-size:11px; }

/* ── řádky A ─────────────────────────────────────────────────────────── */
.va .thead { display:grid; grid-template-columns:1fr 74px 62px 40px; gap:6px; padding:6px 12px;
  border-bottom:1px solid var(--border-subtle); font-size:8.5px; font-weight:900;
  letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
.va .thead span:not(:first-child) { text-align:right; }
.va .row { display:grid; grid-template-columns:1fr 74px 62px 40px; gap:6px; align-items:center;
  padding:0 12px; height:38px; border-bottom:1px solid var(--border-subtle); }
.va .row:last-child { border-bottom:0; }
.va .who { display:flex; align-items:center; gap:7px; min-width:0; }
.va .nm { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.va .row > span:not(.who) { text-align:right; font-size:12px; font-weight:700; }

/* ── řádky B ─────────────────────────────────────────────────────────── */
.vb .row { padding:9px 12px; border-bottom:1px solid var(--border-subtle); }
.vb .row:last-child { border-bottom:0; }
.vb .line1 { display:flex; align-items:center; gap:8px; }
.vb .nm { font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vb .day { margin-left:auto; flex:none; font-size:13px; font-weight:700; }
.vb .line2 { margin-top:5px; display:flex; gap:7px; flex-wrap:wrap; }
.vb .chip { font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px;
  border:1px solid var(--border-subtle); color:var(--text-secondary); }
.vb .chip.open { border-color:rgba(16,185,129,.3); color:var(--win); }
.vb .chip.pos { border-color:rgba(99,102,241,.35); color:var(--accent); }
</style>
</head>
<body>
<h1>Kam s Flatten All</h1>
<p class="lede">Čtyři umístění nahoře. Řádky účtů přepni mezi <b>A (tabulka)</b> a <b>B (řádek + chip)</b> —
  vybíráš zvlášť, umístění Flattenu na tom nezávisí. Přepínač <b>otevřené pozice</b> je tu proto, že
  u varianty 4 se Flatten ukáže jen tehdy, když je co zavírat.</p>

<div class="bar">
  <b>Téma</b>
  <button id="bl" aria-pressed="false" onclick="theme(false)">Světlé</button>
  <button id="bd" aria-pressed="true" onclick="theme(true)">Tmavé</button>
  <span style="width:12px"></span>
  <b>Řádky účtů</b>
  <button id="ra" aria-pressed="false" onclick="setRows('a')">A Tabulka</button>
  <button id="rb" aria-pressed="true" onclick="setRows('b')">B Řádek + chip</button>
  <span style="width:12px"></span>
  <b>Otevřené pozice</b>
  <button id="oy" aria-pressed="true" onclick="setOpen(true)">Mám</button>
  <button id="on" aria-pressed="false" onclick="setOpen(false)">Nemám</button>
</div>

<div class="decks" id="decks"></div>

<script>
const ACC = [
  ['FTDFYG50511354175', 'Tradeify', 610, 0, 0, true],
  ['LFF05066846490007', 'Lucid', -95, 0, 0, false],
  ['APX118862004412', 'Apex', 412, 38, 2, false],
  ['TDF00008206', 'Tradeify', 507, 0, 0, false],
  ['TDF00008207', 'Tradeify', -64, 0, 0, false],
  ['TDF00008208', 'Tradeify', 388, 24, 1, false],
  ['TDF00008209', 'Tradeify', 91, 0, 0, false],
];
const state = { rows: 'b', open: true };
/** Bez otevřených pozic zmizí chipy i důvod Flatten vůbec nabízet. */
const accounts = () => state.open ? ACC : ACC.map(a => [a[0], a[1], a[2], 0, 0, a[5]]);

const short = v => `${v < 0 ? '−' : v > 0 ? '+' : ''}$${Math.abs(Math.round(v))}`;
const tone = v => v > 0 ? 'win' : v < 0 ? 'loss' : 'flat';

const head = () => `<div class="shead" style="padding-bottom:0"><span class="stitle">Kopírovací skupiny</span></div>
  <div class="shead" style="padding-top:8px;padding-bottom:8px">
    <button class="daybtn"><span class="k">Dnešní P&L</span><span class="v num">+$2 906</span><span class="go">›</span></button></div>
  <div class="shead" style="padding-top:0"><span class="addbtn">+ Přidat skupinu</span><span class="iconbtn">⋮</span></div>`;

const rowsHtml = () => state.rows === 'a'
  ? `<div class="thead"><span>Účet</span><span>Denní</span><span>Otevř.</span><span>Poz.</span></div>`
    + accounts().map(([nm, firm, day, open, pos, leader]) => `<div class="row">
        <span class="who"><span class="dot"></span><span class="nm">${nm}</span>${leader ? '<span class="crown">♛</span>' : ''}</span>
        <span class="num ${tone(day)}">${short(day)}</span>
        <span class="num ${open ? tone(open) : 'flat'}">${open ? short(open) : '—'}</span>
        <span class="num flat">${pos || '—'}</span></div>`).join('')
  : accounts().map(([nm, firm, day, open, pos, leader]) => `<div class="row">
      <div class="line1"><span class="dot"></span><span class="nm">${nm}</span>
        ${leader ? '<span class="crown">♛</span>' : ''}
        <span class="day num ${tone(day)}">${short(day)}</span></div>
      ${open || pos ? `<div class="line2">${pos ? `<span class="chip pos">${pos}× MNQ</span>` : ''}
        ${open ? `<span class="chip open">otevř. ${short(open)}</span>` : ''}</div>` : ''}</div>`).join('');

const sum = (four) => `<div class="gsum ${four ? 'four' : 'three'}">
  <div><div class="k">Kapitál</div><div class="v">$97,346</div></div>
  <div><div class="k">Denní P&L</div><div class="v win">$515.00</div></div>
  <div><div class="k">Otevřený</div><div class="v">${state.open ? '$62.00' : '$0.00'}</div></div>
  ${four ? `<div class="flat-cell">Flatten<br>All</div>` : ''}</div>`;

const ghead = (extra = '') => `<div class="ghead">
  <span class="gdot"></span><span class="gname">Hlavní</span>
  <span class="firms"><span style="background:#22c55e">TR</span><span style="background:#94a3b8">LU</span></span>
  <span class="sw push"><i></i><b>OFF</b></span>${extra}</div>`;

const shell = body => `<div class="sect">${head()}
  <div class="gcard v${state.rows}">${body}</div>
  <div style="padding:10px 14px;font-size:11.5px;color:var(--text-secondary)">Celkem skupin: <b>1</b></div></div>`;

const bottom = (withFlatten) => `<div class="acts">
  ${withFlatten ? `<span class="plain grow" style="border-color:rgba(225,29,72,.3);color:var(--loss)">Flatten All</span>` : ''}
  <span class="plain ${withFlatten ? '' : 'grow'}">Upravit</span><span class="plain icon">⋮</span></div>`;

/** 1 — červená ikona hned vedle vypínače skupiny. */
const p1 = () => shell(ghead(`<span class="flat-icon" title="Flatten All">⏻</span>`) + sum(false) + rowsHtml() + bottom(false));

/** 2 — čtvrtá dlaždice v souhrnném pruhu. */
const p2 = () => shell(ghead() + sum(true) + rowsHtml() + bottom(false));

/** 3 — lišta akcí přesunutá zespodu nad účty. */
const p3 = () => shell(ghead() + sum(false)
  + `<div class="toolbar"><span class="danger">Flatten All</span><span class="spacer"></span>
      <span class="plain">Upravit</span><span class="plain icon">⋮</span></div>` + rowsHtml());

/** 4 — Flatten se ukáže jen tehdy, když je co zavírat. */
const p4 = () => shell(ghead() + sum(false)
  + (state.open
    ? `<div class="toolbar"><span class="danger">Flatten All · 2 pozice</span><span class="spacer"></span>
        <span class="plain">Upravit</span><span class="plain icon">⋮</span></div>`
    : `<div class="toolbar"><span class="spacer"></span><span class="plain">Upravit</span><span class="plain icon">⋮</span></div>`)
  + rowsHtml());

const DECKS = [
  ['1', 'Ikona u vypínače', 'Červená ikona hned vedle ON/OFF. <b>Zabere nula pixelů navíc</b> a sedí k tomu druhému „vypínači“. Ale ikona bez popisku u destruktivní akce je hádanka — a je nebezpečně blízko vypínači kopírky.', p1],
  ['2', 'Čtvrtá dlaždice v souhrnu', 'Flatten je součást pruhu s čísly. <b>Taky nula pixelů navíc.</b> Zaplatíš tím, že se tři čísla stlačí — a tlačítko v tabulce čísel vypadá jako překlep.', p2],
  ['3', 'Lišta přesunutá nahoru', 'Dnešní spodní lišta jen přestěhovaná nad účty. <b>Flatten je vidět bez scrollování</b>, i když máš dvacet účtů. Karta se o nic neprodlouží, jen se pořadí otočí.', p3],
  ['4', 'Jen když je co zavírat', 'Jako 3, ale <b>Flatten se objeví jen s otevřenou pozicí</b> a rovnou řekne kolika se to týká. V klidu je karta čistá. Přepni „Otevřené pozice: Nemám“.', p4],
];

function render() {
  document.getElementById('decks').innerHTML = DECKS.map(([key, name, note, build]) => `
    <div class="deck"><h2><em>${key}</em>${name}</h2><p>${note}</p>
      <div class="phone">${build()}</div></div>`).join('');
}
function setRows(value) {
  state.rows = value;
  document.getElementById('ra').setAttribute('aria-pressed', String(value === 'a'));
  document.getElementById('rb').setAttribute('aria-pressed', String(value === 'b'));
  render();
}
function setOpen(value) {
  state.open = value;
  document.getElementById('oy').setAttribute('aria-pressed', String(value));
  document.getElementById('on').setAttribute('aria-pressed', String(!value));
  render();
}
function theme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  document.getElementById('bd').setAttribute('aria-pressed', String(dark));
  document.getElementById('bl').setAttribute('aria-pressed', String(!dark));
}
theme(true);
render();
</script>
</body>
</html>
